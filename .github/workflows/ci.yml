name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: 'stable'}
      - name: Vet
        run: go vet ./...
      - name: Build (default + experimental)
        run: go build ./... && go build -tags experimental ./...
      - name: Test
        run: go test ./...
